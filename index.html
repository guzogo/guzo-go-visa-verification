<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUZO GO Visa Verification</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef2f7;
padding:20px;
}

.header{
background:#003366;
color:white;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
border-radius:12px;
margin-bottom:20px;
}

.card{
max-width:600px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:12px;
background:#003366;
color:white;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#004d99;
}

.result-card{
margin-top:20px;
border:1px solid #ddd;
border-radius:12px;
overflow:hidden;
}

.result-header{
background:#003366;
color:white;
text-align:center;
padding:20px;
}

.result-photo{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:4px solid white;
margin-top:10px;
}

.result-body{
padding:20px;
}

.row{
padding:8px 0;
border-bottom:1px solid #eee;
}

#qrcode{
display:flex;
justify-content:center;
padding:20px;
}

</style>
</head>

<body>

<div class="header">
GUZO GO Visa Verification
</div>

<div class="card">

<h2>Visa Verification</h2>

<input
type="text"
id="visaId"
placeholder="Enter Visa ID">

<button onclick="verifyVisa()">
Verify Visa
</button>

<div id="result"></div>
<div id="qrcode"></div>

</div>

<script type="module">

import { db } from "./firebase.js";
import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

async function verifyVisa(){

const visaId =
document.getElementById("visaId").value.trim();

const snapshot =
await getDocs(collection(db,"applicants"));

let applicant = null;

snapshot.forEach((doc)=>{

const data = doc.data();

if(data.id === visaId){
applicant = data;
}

});

if(!applicant){

document.getElementById("result").innerHTML =
"<h3 style='color:red;text-align:center'>❌ Visa ID Not Found</h3>";

document.getElementById("qrcode").innerHTML="";

return;

}
  document.getElementById("result").innerHTML = `

<div class="result-card">

<div class="result-header">

<h2>${applicant.name}</h2>

<img
class="result-photo"
src="${applicant.photo || 'https://via.placeholder.com/150'}">

</div>

<div class="result-body">

<div class="row"><b>Visa ID:</b> ${applicant.id}</div>

<div class="row"><b>Passport:</b> ${applicant.passport}</div>

<div class="row"><b>Date of Birth:</b> ${applicant.dob}</div>

<div class="row"><b>Country:</b> ${applicant.country}</div>

<div class="row"><b>Visa Type:</b> ${applicant.type}</div>

<div class="row"><b>Status:</b> ${applicant.status}</div>

<div class="row"><b>Issue Date:</b> ${applicant.issueDate}</div>

<div class="row"><b>Expiry Date:</b> ${applicant.expiryDate}</div>

</div>

</div>

`;

document.getElementById("qrcode").innerHTML = "";

new QRCode(document.getElementById("qrcode"),{
text: applicant.id,
width:160,
height:160
});

}

window.verifyVisa = verifyVisa;

</script>

</body>
</html>
