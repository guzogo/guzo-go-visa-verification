<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUZO GO Visa Verification</title>

  <link rel="stylesheet" href="style.css">

  <script type="module" src="firebase.js"></script>
  <script type="module" src="app.js"></script>
</head>

<body>

<header>
    <div class="logo">
        <img src="logo.png" alt="GUZO GO">
        <h1>GUZO GO</h1>
    </div>

    <h2>Visa Verification System</h2>
</header>

<section class="search-box">

<h3>Verify Your Visa</h3>

<input
type="text"
id="searchInput"
placeholder="Passport Number or Application ID">

<button id="searchBtn">
Verify
</button>

</section>

<section id="loading" class="hidden">
Loading...
</section>

<section id="result" class="hidden">

<div class="card">

<img id="photo">

<h2 id="fullName"></h2>

<p>
<strong>Passport:</strong>
<span id="passport"></span>
</p>

<p>
<strong>Application ID:</strong>
<span id="application"></span>
</p>

<p>
<strong>Country:</strong>
<span id="country"></span>
</p>

<p>
<strong>Visa Type:</strong>
<span id="visaType"></span>
</p>

<p>
<strong>Status:</strong>
<span id="status"></span>
</p>

<p>
<strong>Issue Date:</strong>
<span id="issueDate"></span>
</p>

<p>
<strong>Expiry Date:</strong>
<span id="expiryDate"></span>
</p>

</div>

</section>

<section id="notFound" class="hidden">

<h2>
No Record Found
</h2>

<p>
Please check your Passport Number or Application ID.
</p>

</section>

<footer>

<p>

© 2026 GUZO GO

</p>

</footer>

</body>
 </html>
