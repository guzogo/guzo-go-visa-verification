<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUZO GO Visa Verification</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef2f7;
padding:20px;
}

.header{
background:#003366;
color:#fff;
text-align:center;
padding:18px;
font-size:24px;
font-weight:bold;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.search-box{
max-width:550px;
margin:auto;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.search-box h3{
margin-bottom:15px;
color:#003366;
text-align:center;
}

input{
width:100%;
padding:13px;
margin-top:10px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

button{
width:100%;
padding:13px;
margin-top:12px;
background:#003366;
color:white;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#004a99;
}

.result-card{
max-width:550px;
margin:25px auto;
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.card-top{
background:#003366;
color:white;
text-align:center;
padding:20px;
}

.photo{
width:140px;
height:140px;
border-radius:50%;
border:5px solid white;
object-fit:cover;
margin-top:10px;
}

.card-body{
padding:20px;
}

.row{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #eee;
}

.label{
font-weight:bold;
color:#003366;
}

.status-approved{
color:green;
font-weight:bold;
}

.status-processing{
color:orange;
font-weight:bold;
}

.status-rejected{
color:red;
font-weight:bold;
}

#qrcode{
display:flex;
justify-content:center;
padding:20px;
}

.footer{
text-align:center;
margin-top:25px;
color:#777;
font-size:14px;
}

</style>

</head>

<body>

<div class="header">
GUZO GO Visa Verification
</div>

<div class="search-box">

<h3>Visa Verification System</h3>

<input
type="text"
id="visaId"
placeholder="Enter Visa ID">

<button id="verifyBtn">
Verify Visa
</button>

</div>

<div id="result"></div>
