<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUZO GO Visa Verification</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef2f7;
padding:20px;
}

.header{
background:#003366;
color:white;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
border-radius:12px;
margin-bottom:20px;
}

.card{
max-width:600px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:12px;
background:#003366;
color:white;
border:none;
border-radius:8px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#004d99;
}

.result-card{
margin-top:20px;
border:1px solid #ddd;
border-radius:12px;
overflow:hidden;
}

.result-header{
background:#003366;
color:white;
text-align:center;
padding:20px;
}

.result-photo{
width:130px;
height:130px;
border-radius:50%;
object-fit:cover;
border:4px solid white;
margin-top:10px;
}

.result-body{
padding:20px;
}

.row{
padding:8px 0;
border-bottom:1px solid #eee;
}

#qrcode{
display:flex;
justify-content:center;
padding:20px;
}
.visa-card{
max-width:700px;
margin:20px auto;
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.card-header{
background:#0b376b;
color:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
}

.logo{
font-size:28px;
font-weight:bold;
}

.verified{
font-size:18px;
font-weight:bold;
color:#ffd54f;
}

.card-top{
display:flex;
gap:20px;
padding:25px;
align-items:center;
}

.photo-box{
width:180px;
}

.photo{
width:170px;
height:210px;
object-fit:cover;
border-radius:12px;
border:4px solid #0b376b;
}

.info-top{
flex:1;
}

.info-top h1{
margin:0;
font-size:34px;
color:#0b376b;
}

.visa-id{
display:inline-block;
margin-top:15px;
padding:10px 25px;
background:#0b376b;
color:white;
font-size:22px;
font-weight:bold;
border-radius:10px;
}

.mini-info{
display:flex;
gap:50px;
margin-top:25px;
}

.details{
padding:25px;
}

.details div{
display:flex;
justify-content:space-between;
padding:12px 0;
border-bottom:1px solid #ddd;
font-size:18px;
}

.status{
font-weight:bold;
color:green;
}

#qrcode{
display:flex;
justify-content:center;
padding:30px;
  }
</style>
</head>

<body>

<div class="header">
GUZO GO Visa Verification
</div>

<div class="card">

<h2>Visa Verification</h2>

<input
type="text"
id="visaId"
placeholder="Enter Visa ID">

<button onclick="verifyVisa()">
Verify Visa
</button>

<div id="result"></div>
<div id="qrcode"></div>

</div>

<script type="module">

import { db } from "./firebase.js";
import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

async function verifyVisa(){

const visaId =
document.getElementById("visaId").value.trim();

const snapshot =
await getDocs(collection(db,"applicants"));

let applicant = null;

snapshot.forEach((doc)=>{

const data = doc.data();

if(data.id === visaId){
applicant = data;
}

});

if(!applicant){

document.getElementById("result").innerHTML =
"<h3 style='color:red;text-align:center'>❌ Visa ID Not Found</h3>";

document.getElementById("qrcode").innerHTML="";

return;

}
  document.getElementById("result").innerHTML = `

<div class="visa-card">

<div class="card-header">

<div class="logo">
GUZO GO
</div>

<div class="verify">
✔ VERIFIED VISA
</div>

</div>

<div class="card-body">

<div class="left">

<img
src="${applicant.photo || 'https://via.placeholder.com/180x220'}"
class="photo">

<div id="qrcode"></div>

</div>

<div class="right">

<div class="name">
${applicant.name}
</div>

<div class="visa-id">
${applicant.id}
</div>

<div class="info-row">
<b>Passport</b>
<span>${applicant.passport}</span>
</div>

<div class="info-row">
<b>Date of Birth</b>
<span>${applicant.dob}</span>
</div>

<div class="info-row">
<b>Country</b>
<span>${applicant.country}</span>
</div>

<div class="info-row">
<b>Visa Type</b>
<span>${applicant.type}</span>
</div>

<div class="info-row">
<b>Status</b>
<span class="status-approved">
${applicant.status}
</span>
</div>

<div class="info-row">
<b>Issue Date</b>
<span>${applicant.issueDate}</span>
</div>

<div class="info-row">
<b>Expiry Date</b>
<span>${applicant.expiryDate}</span>
</div>

</div>

</div>

<div class="footer">
GUZO GO • Official Visa Verification System
</div>

</div>

`;
  document.getElementById("qrcode").innerHTML = "";

new QRCode(document.getElementById("qrcode"),{
    text: applicant.id,
    width:150,
    height:150
});

}

window.verifyVisa = verifyVisa;
document.getElementById("result").innerHTML = `

<div class="visa-card">

<div class="card-header">

<div class="logo">
GUZO GO
</div>

<div class="verified">
✔ VERIFIED VISA
</div>

</div>

<div class="card-top">

<div class="photo-box">

<img src="${user.photo}" class="photo">

</div>

<div class="info-top">

<h1>${user.name}</h1>

<div class="visa-id">
${user.id}
</div>

<div class="mini-info">

<p><b>Country</b><br>${user.country}</p>

<p><b>Visa Type</b><br>${user.type}</p>

</div>

</div>

</div>

<div class="details">

<div><b>Passport</b><span>${user.passport}</span></div>

<div><b>Date of Birth</b><span>${user.dob}</span></div>

<div><b>Status</b><span class="status">${user.status}</span></div>

<div><b>Issue Date</b><span>${user.issueDate}</span></div>

<div><b>Expiry Date</b><span>${user.expiryDate}</span></div>

</div>

<div id="qrcode"></div>

</div>

`;  

document.getElementById("qrcode").innerHTML = "";

new QRCode(document.getElementById("qrcode"),{
text: applicant.id,
width:160,
height:160
});

}

window.verifyVisa = verifyVisa;

</script>

</body>
</html>
