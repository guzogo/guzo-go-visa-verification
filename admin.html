<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUZO GO Admin Dashboard</title>

  <link rel="stylesheet" href="style.css">
  <script type="module" src="admin.js"></script>
</head>

<body>

<header>
  <h1>GUZO GO Admin Dashboard</h1>
</header>

<section class="search-box">
  <h3>Add / Update Visa Record</h3>

  <input id="fullName" placeholder="Full Name"><br><br>
  <input id="passportNumber" placeholder="Passport Number"><br><br>
  <input id="applicationId" placeholder="Application ID"><br><br>
  <input id="country" placeholder="Country"><br><br>
  <input id="visaType" placeholder="Visa Type"><br><br>
  <input id="status" placeholder="Status (Approved/Pending/Rejected)"><br><br>
  <input id="issueDate" placeholder="Issue Date"><br><br>
  <input id="expiryDate" placeholder="Expiry Date"><br><br>
  <input id="photoURL" placeholder="Photo URL"><br><br>

  <button id="saveBtn">Save</button>
</section>

<section class="search-box">
  <h3>Search Record</h3>
  <input id="searchKey" placeholder="Passport or Application ID">
  <button id="searchBtn">Search</button>
</section>

<section id="adminResult" class="card hidden"></section>

</bod>
</html>
